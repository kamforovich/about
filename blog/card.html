<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Прев'ю монети</title>
  <style>
    /* Загальні стилі сторінки для центрування */
    body {
      background-color: #12161f;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
    }

    /* Контейнер картки у стилі прикладу */
    .card {
      width: 320px;
      height: 380px;
      background-color: #1a1f29;
      border: 1px solid #2a313d;
      border-radius: 16px;
      padding: 24px;
      box-sizing: border-box;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }

    /* Контейнер перспективи для 3D-ефекту */
    .coin-container {
      width: 200px;
      height: 200px;
      perspective: 1000px;
      cursor: pointer;
    }

    /* 3D елемент монети, який перевертається */
    .coin {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.8s cubic-bezier(0.4, 0.2, 0.2, 1);
    }

    /* Ефект перевороту при наведенні */
    .coin-container:hover .coin {
      transform: rotateY(180deg);
    }

    /* Загальні стилі для сторін монети */
    .coin-face {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      backface-visibility: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      box-sizing: border-box;
    }

    /* Аверс (передній бік) */
    .coin-front {
      border: 2px dashed #4a5568;
      background: radial-gradient(circle, rgba(30, 37, 48, 0.6) 0%, rgba(20, 25, 33, 0.8) 100%);
      transform: rotateY(0deg);
    }

    /* Реверс (зворотний бік) */
    .coin-back {
      border: 2px dashed #6b7280;
      background: radial-gradient(circle, rgba(35, 43, 56, 0.7) 0%, rgba(15, 20, 27, 0.9) 100%);
      transform: rotateY(180deg);
    }

    /* Внутрішнє пунктирне коло монети */
    .coin-inner-circle {
      width: 70%;
      height: 70%;
      border: 1px dashed #4a5568;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    /* Текст по колу */
    .coin-text {
      position: absolute;
      width: 100%;
      height: 100%;
      fill: #a0aec0;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    /* Лабел-підказка вгорі монети */
    .side-label {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 4px 8px;
      font-size: 10px;
      color: #718096;
      display: flex;
      align-items: center;
      gap: 4px;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div class="card">
    <!-- Контейнер з 3D перспективою -->
    <div class="coin-container">
      
      <!-- Монета -->
      <div class="coin">
        
        <!-- Передній бік (Аверс) -->
        <div class="coin-face coin-front">
          <svg class="coin-text" viewBox="0 0 100 100">
            <path id="textPathTop" d="M 15,50 A 35,35 0 1,1 85,50" fill="none" />
            <path id="textPathBottom" d="M 85,50 A 35,35 0 0,1 15,50" fill="none" />
            <text>
              <textPath href="#textPathTop" startOffset="50%" text-anchor="middle">
                Президент України
              </textPath>
              <textPath href="#textPathBottom" startOffset="50%" text-anchor="middle">
                Степан Срака
              </textPath>
            </text>
          </svg>
          <div class="coin-inner-circle"></div>
        </div>

        <!-- Зворотний бік (Реверс) -->
        <div class="coin-face coin-back">
          <svg class="coin-text" viewBox="0 0 100 100">
            <path id="textPathBack" d="M 15,50 A 35,35 0 1,1 85,50" fill="none" />
            <text>
              <textPath href="#textPathBack" startOffset="50%" text-anchor="middle">
                Україна • 2026
              </textPath>
            </text>
          </svg>
          <div class="coin-inner-circle">
            <span style="color: #6b7280; font-weight: bold; font-size: 14px;">РЕВЕРС</span>
          </div>
        </div>

      </div>

    </div>
  </div>

</body>
</html>
