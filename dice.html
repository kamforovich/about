<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Суперфермер - Професійні Кубики</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            background-color: #141414;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            cursor: pointer;
            font-family: system-ui, -apple-system, sans-serif;
        }

        .table {
            display: flex;
            width: 100%;
            max-width: 800px;
            justify-content: space-around;
            align-items: center;
            gap: 5vw;
            padding: 20px;
        }

        .slot-container {
            width: 42vw;
            height: 42vw;
            max-width: 260px;
            max-height: 260px;
            border-radius: 28px;
            background-color: #ffffff;
            position: relative;
            overflow: hidden;
            border: 8px solid;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .blue-dice { 
            border-color: #2980b9; 
            box-shadow: 0 0 35px rgba(41, 128, 185, 0.5), inset 0 0 20px rgba(0,0,0,0.1); 
        }
        
        .red-dice { 
            border-color: #c0392b; 
            box-shadow: 0 0 35px rgba(192, 57, 43, 0.5), inset 0 0 20px rgba(0,0,0,0.1); 
        }

        .slot-reel {
            position: absolute;
            top: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            /* Кастомна крива безве для ефекту різкого старту і плавного гальмування */
            transition: top 0s cubic-bezier(0.15, 0.85, 0.3, 1);
        }

        .slot-icon {
            width: 100%;
            height: 42vw;
            max-height: 244px; /* Точна висота вікна мінус бордери */
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 19vw;
        }

        @media (min-width: 600px) {
            .slot-icon {
                font-size: 120px;
            }
        }
    </style>
</head>
<body onclick="rollAll()">

    <div class="table">
        <div class="slot-container blue-dice">
            <div id="blue-reel" class="slot-reel"></div>
        </div>

        <div class="slot-container red-dice">
            <div id="red-reel" class="slot-reel"></div>
        </div>
    </div>

    <script>
        // Еталонні 12 граней за офіційними правилами гри "Суперфермер"
        // Математична ймовірність випадіння кожної грані: 1/12 (8.33%)
        const blueDiceRules = ["🐰", "🐰", "🐰", "🐰", "🐰", "🐰", "🐑", "🐑", "🐑", "🐷", "🐴", "🦊"];
        const redDiceRules  = ["🐰", "🐰", "🐰", "🐰", "🐰", "🐰", "🐑", "🐑", "🐷", "🐷", "🐮", "🐺"];

        let isRolling = false;

        // Функція перемішування масиву (Фішер-Йетс) для випадкового порядку стрічки
        function shuffle(array) {
            let m = array.length, t, i;
            while (m) {
                i = Math.floor(Math.random() * m--);
                t = array[m];
                array[m] = array[i];
                array[i] = t;
            }
            return array;
        }

        function buildAndSpinReel(reelElement, baseFaces, finalResult, duration) {
            reelElement.innerHTML = ''; 
            
            // Створюємо довгу стрічку: беремо оригінальні грані, перемішуємо їх 
            // і повторюємо кілька разів, щоб під час прокрутки миготіли правильні тварини
            let longReelSet = [];
            for(let i = 0; i < 3; i++) {
                longReelSet = longReelSet.concat(shuffle([...baseFaces]));
            }

            // Додаємо іконки на сторінку
            longReelSet.forEach(face => {
                const iconDiv = document.createElement('div');
                iconDiv.className = 'slot-icon';
                iconDiv.textContent = face;
                reelElement.appendChild(iconDiv);
            });

            // Сама остання іконка — це наш фінальний 100% чесний результат за законами ймовірності
            const finalDiv = document.createElement('div');
            finalDiv.className = 'slot-icon';
            finalDiv.textContent = finalResult;
            reelElement.appendChild(finalDiv);

            const iconHeight = reelElement.parentElement.clientHeight;
            const totalIcons = longReelSet.length + 1;

            // Миттєве скидання позиції на початок стрічки
            reelElement.style.transition = 'none';
            reelElement.style.top = '0px';
            
            void reelElement.offsetHeight; // тригер перемальовки

            // Запуск плавної анімації прокрутки вниз
            reelElement.style.transition = `top ${duration}ms cubic-bezier(0.15, 0.85, 0.3, 1)`;
            reelElement.style.top = `-${iconHeight * (totalIcons - 1)}px`;
        }

        function rollAll() {
            if (isRolling) return; 
            isRolling = true;

            // 1. Абсолютно чесний вибір результату з 12 граней оригінального кубика
            const finalBlue = blueDiceRules[Math.floor(Math.random() * blueDiceRules.length)];
            const finalRed = redDiceRules[Math.floor(Math.random() * redDiceRules.length)];

            const blueReel = document.getElementById('blue-reel');
            const redReel = document.getElementById('red-reel');

            // 2. Запускаємо крутіння з різною тривалістю для більшого реалізму
            // Синій кубик зупиниться за 1400мс, а Червоний крутитиметься трохи довше — 1900мс
            buildAndSpinReel(blueReel, blueDiceRules, finalBlue, 1400);
            buildAndSpinReel(redReel, redDiceRules, finalRed, 1900);

            // Розблокування екрана після того, як зупиниться останній (червоний) кубик
            setTimeout(() => {
                isRolling = false;
            }, 1900);
        }

        // Автозапуск при відкритті
        window.onload = () => {
            rollAll();
        };

        // Адаптація під зміну розміру екрана в процесі гри
        window.onresize = () => {
            if (!isRolling) {
                const blueReel = document.getElementById('blue-reel');
                const redReel = document.getElementById('red-reel');
                const iconHeight = blueReel.parentElement.clientHeight;
                
                blueReel.style.transition = 'none';
                redReel.style.transition = 'none';
                
                // Фіксуємо стрічки на останньому елементі (36-й елемент в масиві)
                blueReel.style.top = `-${iconHeight * 36}px`;
                redReel.style.top = `-${iconHeight * 36}px`;
            }
        };
    </script>
</body>
</html>
